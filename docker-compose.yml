services:
  web:
    build:
      context: ./web
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    ports:
      - "3000:3000"
    environment:
      - API_URL=${SERVER_API_URL:?set SERVER_API_URL in .env}
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - backend-db:/app/db
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      - DJANGO_DEBUG=0
      - DJANGO_DB_PATH=/app/db/db.sqlite3
      - DATA_DIR=/app/data
      - FRESH_DB=1
      - DJANGO_SUPERUSER_MOBILE=${DJANGO_SUPERUSER_MOBILE:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
    restart: unless-stopped

volumes:
  backend-db: